<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRITIA — Comparar versiones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="critia.css">
  <style>
    .wrap { padding: 0 clamp(16px, 6vw, 90px); }

    .cabecera {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      padding: clamp(28px, 6vh, 64px) 0 28px;
      border-bottom: 1px solid var(--gray-500);
    }

    .vs {
      display: flex;
      align-items: baseline;
      gap: .25em;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(48px, 7vw, 104px);
      letter-spacing: -.03em;
      line-height: 1;
    }

    .vs em {
      font-family: var(--font-serif);
      font-weight: 400;
      font-style: italic;
      color: var(--gray-500);
      font-size: .62em;
      letter-spacing: -.01em;
      padding: 0 .1em;
    }

    .vs .punto {
      width: .26em;
      height: .26em;
      border-radius: 50%;
      background: var(--orange);
      display: inline-block;
      margin-left: .05em;
    }

    .score { text-align: right; }

    .score-num {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(56px, 6vw, 84px);
      line-height: 1;
    }

    .score-num svg { width: .6em; height: .8em; stroke: var(--orange); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .score-num.baja svg { transform: rotate(180deg); }

    .score-desc {
      margin-top: 8px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--gray-500);
    }

    .imagenes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(20px, 11vw, 165px);
      margin-top: clamp(32px, 7vh, 100px);
    }

    .imagenes figure { margin: 0; }

    .imagenes .img {
      background: var(--beige);
      aspect-ratio: 553 / 435;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .imagenes img { width: 100%; height: 100%; object-fit: contain; }

    .imagenes figcaption {
      margin-top: 12px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--gray-500);
    }

    .imagenes figure:last-child figcaption { text-align: right; }

    .filas { margin: 40px 0 60px; list-style: none; }

    .fila {
      display: grid;
      grid-template-columns: 1fr 36px 178px 36px 1fr;
      align-items: center;
      gap: 32px;
      padding: 18px 0;
    }

    .fila .nombre {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(16px, 1.6vw, 24px);
      text-transform: uppercase;
    }

    .fila .nombre.der { text-align: right; }

    .fila .dot { width: 36px; height: 36px; }

    .cambio {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 60px;
      border-radius: 30px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 18px;
      letter-spacing: .14em;
      text-transform: uppercase;
      border: 1.5px solid var(--black);
    }

    .cambio.mejoro { background: var(--black); color: var(--white); }
    .cambio.mejoro b { color: var(--orange); }
    .cambio.igual { color: var(--gray-500); }
    .cambio.bajo { border-color: var(--orange); color: var(--orange); }

    .sintesis-band { padding: 56px clamp(16px, 6vw, 90px); }

    .sintesis-grid {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      flex-wrap: wrap;
    }

    .sintesis-band blockquote {
      margin-top: 22px;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(30px, 3.2vw, 48px);
      line-height: 1.02;
      max-width: 820px;
    }

    .sintesis-band .ia { margin-top: 18px; font-size: 16px; max-width: 760px; color: var(--gray-700); }

    .acciones { display: flex; flex-wrap: wrap; gap: 12px; }

    .vacio-total { padding: 80px var(--gutter); text-align: center; }
    .vacio-total p { margin: 16px auto 28px; max-width: 560px; }

    @media (max-width: 760px) {
      .score { text-align: left; }
      .imagenes { grid-template-columns: 1fr 1fr; gap: 12px; }
      .fila { grid-template-columns: 1fr 22px 104px 22px; gap: 10px; padding: 12px 0; }
      .fila .nombre.der { display: none; }
      .fila .dot { width: 22px; height: 22px; }
      .cambio { height: 40px; font-size: 12px; letter-spacing: .06em; }
    }

    @media print {
      .sintesis-band { break-inside: avoid; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="logo" aria-label="CRITIA, volver al inicio">CRITIA</a>
    <div class="topbar-right no-print">
      <a href="resultado.html" class="btn btn-sm">← Volver a la crítica</a>
      <button type="button" class="btn btn-sm btn-dark" id="exportarBtn">Exportar PDF</button>
    </div>
  </header>

  <div id="app"></div>

  <script src="critia-common.js"></script>
  <script src="comparar.js"></script>
</body>
</html>
